 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AgriFarm</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-icon">🌱</span>
        AgriFarm
      </a>
      <ul class="nav-links">
        <li><a href="index.html" data-page="home">Home</a></li>
        <li><a href="crops.html" data-page="crops">Crops</a></li>
        <li><a href="marketplace.html" data-page="marketplace">Marketplace</a></li>
        <li><a href="tips.html" data-page="tips">Farming Tips</a></li>
        <li><a href="contact.html" data-page="contact">Contact</a></li>
      </ul>
      <div class="nav-auth" id="navAuth"></div>
    </div>
  </nav>

  <div class="page-container">
    <div class="form-card">
      <h1>🔐 Farmer Login</h1>
      <p class="form-subtitle">Welcome back! Login to your AgriFarm account</p>

      <div id="loginMessage" class="message"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px">Login</button>
      </form>

      <p class="form-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 AgriFarm of India.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/crops-google-data.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>redirectIfLoggedIn();</script>
</body>
</html>
