<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace - AgriFarm</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-icon">🌱</span>
        AgriFarm
      </a>
      <ul class="nav-links">
        <li><a href="index.html" data-page="home">Home</a></li>
        <li><a href="crops.html" data-page="crops">Crops</a></li>
        <li><a href="marketplace.html" data-page="marketplace" class="active">Marketplace</a></li>
        <li><a href="tips.html" data-page="tips">Farming Tips</a></li>
        <li><a href="contact.html" data-page="contact">Contact</a></li>
      </ul>
      <div class="nav-auth" id="navAuth"></div>
    </div>
  </nav>

  <section class="section">
    <h1 class="page-title">🛒 Agri Marketplace</h1>
    <p class="page-subtitle">Buy and sell fresh produce directly from local farmers</p>

    <div class="marketplace-layout">
      <div class="form-card">
        <h3 style="color:var(--green-dark); margin-bottom:16px">Add Your Produce</h3>
        <p style="color:var(--gray-600); font-size:0.9rem; margin-bottom:20px">Login required to post listings</p>

        <div id="listingMessage" class="message"></div>

        <form id="listingForm" onsubmit="handleAddListing(event)">
          <div class="form-group">
            <label for="cropName">Crop / Product Name *</label>
            <input type="text" id="cropName" placeholder="e.g. Organic Tomatoes" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="quantity">Quantity *</label>
              <input type="number" id="quantity" placeholder="100" min="1" required>
            </div>
            <div class="form-group">
              <label for="unit">Unit *</label>
              <select id="unit" required>
                <option value="kg">kg</option>
                <option value="quintal">Quintal</option>
                <option value="ton">Ton</option>
                <option value="dozen">Dozen</option>
                <option value="piece">Piece</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="price">Price per Unit (₹) *</label>
            <input type="number" id="price" placeholder="50" min="1" required>
          </div>

          <div class="form-group">
            <label for="description">Description (optional)</label>
            <textarea id="description" placeholder="Fresh harvest, organic, delivery available..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%">Post Listing</button>
        </form>
      </div>

      <div>
        <h3 style="color:var(--green-dark); margin-bottom:20px">Available Produce</h3>
        <div class="listings-grid" id="listingsGrid"></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2026 AgriFarm. Built with HTML, CSS & JavaScript.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/crops-google-data.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    setActiveNav('marketplace');
    loadMarketplace();
  </script>
</body>
</html>
