<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AgriFarm</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-icon">🌱</span>
        AgriFarm
      </a>
      <ul class="nav-links">
        <li><a href="index.html" data-page="home">Home</a></li>
        <li><a href="crops.html" data-page="crops">Crops</a></li>
        <li><a href="marketplace.html" data-page="marketplace">Marketplace</a></li>
        <li><a href="tips.html" data-page="tips">Farming Tips</a></li>
        <li><a href="contact.html" data-page="contact">Contact</a></li>
      </ul>
      <div class="nav-auth" id="navAuth"></div>
    </div>
  </nav>

  <div class="page-container">
    <div class="form-card">
      <h1>🌱 Farmer Registration</h1>
      <p class="form-subtitle">Create your free AgriFarm account to access all features</p>

      <div id="registerMessage" class="message"></div>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" placeholder="10-digit mobile number" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" placeholder="Min 6 characters" required>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password *</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
          </div>
        </div>

        <div class="form-group">
          <label for="location">Farm Location *</label>
          <input type="text" id="location" placeholder="Village, District, State" required>
        </div>

        <div class="form-group">
          <label for="farmType">Farm Type *</label>
          <select id="farmType" required>
            <option value="">Select farm type</option>
            <option value="Crop Farming">Crop Farming</option>
            <option value="Vegetable Farming">Vegetable Farming</option>
            <option value="Fruit Orchard">Fruit Orchard</option>
            <option value="Mixed Farming">Mixed Farming</option>
            <option value="Organic Farming">Organic Farming</option>
            <option value="Dairy + Crops">Dairy + Crops</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px">Create Account</button>
      </form>

      <p class="form-footer">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 AgriFarm. Built with HTML, CSS & JavaScript.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/crops-google-data.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>redirectIfLoggedIn();</script>
</body>
</html>
